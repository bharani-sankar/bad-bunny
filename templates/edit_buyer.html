{% extends "base.html" %} {% block page_title %}Edit Buyer{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h5>Edit Buyer Details</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Name *</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              value="{{ buyer.name }}"
              required
            />
          </div>
          <div class="mb-3">
            <label for="mobile" class="form-label">Mobile Number *</label>
            <input
              type="tel"
              class="form-control"
              id="mobile"
              name="mobile"
              value="{{ buyer.mobile }}"
              required
            />
          </div>
          <div class="mb-3">
            <label for="place" class="form-label">Place *</label>
            <input
              type="text"
              class="form-control"
              id="place"
              name="place"
              value="{{ buyer.place }}"
              required
            />
          </div>
          <div class="mb-3">
            <label for="business_type" class="form-label">Business Type</label>
            <input
              type="text"
              class="form-control"
              id="business_type"
              name="business_type"
              value="{{ buyer.business_type or '' }}"
              placeholder="Factory, Trader, etc."
            />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Save Changes</button>
            <a href="{{ url_for('buyers') }}" class="btn btn-secondary"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
