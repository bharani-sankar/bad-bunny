{% extends "base.html" %} {% block page_title %}Add Farmer{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h5>Add New Farmer</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Name *</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              required
            />
          </div>
          <div class="mb-3">
            <label for="mobile" class="form-label">Mobile Number *</label>
            <input
              type="tel"
              class="form-control"
              id="mobile"
              name="mobile"
              required
            />
          </div>
          <div class="mb-3">
            <label for="place" class="form-label">Place *</label>
            <input
              type="text"
              class="form-control"
              id="place"
              name="place"
              required
            />
          </div>
          <div class="mb-3">
            <label for="acres_owned" class="form-label">Acres Owned</label>
            <input
              type="number"
              step="0.1"
              class="form-control"
              id="acres_owned"
              name="acres_owned"
            />
          </div>
          <div class="mb-3">
            <label for="acres_cultivated" class="form-label"
              >Acres Cultivated</label
            >
            <input
              type="number"
              step="0.1"
              class="form-control"
              id="acres_cultivated"
              name="acres_cultivated"
            />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Add Farmer</button>
            <a href="{{ url_for('farmers') }}" class="btn btn-secondary"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
