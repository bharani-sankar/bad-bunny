{% extends "base.html" %}
{% block page_title %}Edit Outward Transaction{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h5>Edit Outward Transaction (To Buyer)</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="buyer_id" class="form-label">Select Buyer *</label>
                <select class="form-control" id="buyer_id" name="buyer_id" required>
                  <option value="">Choose buyer...</option>
                  {% for buyer in buyers %}
                  <option value="{{ buyer.id }}" {% if buyer.id == transaction.buyer_id %}selected{% endif %}>
                    {{ buyer.name }} - {{ buyer.mobile }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="transaction_date" class="form-label">Transaction Date *</label>
                <input type="date" class="form-control" id="transaction_date" name="transaction_date" value="{{ transaction.transaction_date }}" required />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="weight_tons" class="form-label">Weight (Tons) *</label>
                <input type="number" step="0.01" class="form-control" id="weight_tons" name="weight_tons" value="{{ transaction.weight_tons }}" required />
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="selling_price" class="form-label">Selling Price (₹ per Ton) *</label>
                <input type="number" step="0.01" class="form-control" id="selling_price" name="selling_price" value="{{ transaction.selling_price }}" required />
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="total_amount" class="form-label">Total Amount (₹)</label>
            <input type="number" step="0.01" class="form-control" id="total_amount" name="total_amount" value="{{ transaction.total_amount }}" readonly />
          </div>

          <div class="mb-3">
            <label for="notes" class="form-label">Notes</label>
            <textarea class="form-control" id="notes" name="notes" rows="3">{{ transaction.notes or '' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-info">Save Changes</button>
            <a href="{{ url_for('outward') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  // Auto calculate total amount
  const weightInput = document.getElementById("weight_tons");
  const priceInput = document.getElementById("selling_price");

  weightInput.addEventListener("input", calculateAmount);
  priceInput.addEventListener("input", calculateAmount);

  function calculateAmount() {
    const weight = parseFloat(weightInput.value) || 0;
    const price = parseFloat(priceInput.value) || 0;
    document.getElementById("total_amount").value = (weight * price).toFixed(2);
  }
</script>
{% endblock %}
