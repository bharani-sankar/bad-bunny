<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dairy Management System - Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .auth-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        padding: 40px;
        position: relative;
        overflow: hidden;
      }

      .auth-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2);
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo h1 {
        color: #333;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .logo p {
        color: #666;
        font-size: 14px;
        font-weight: 400;
      }

      .form-tabs {
        display: flex;
        margin-bottom: 30px;
        border-radius: 10px;
        background: #f8f9fa;
        padding: 4px;
      }

      .tab-button {
        flex: 1;
        padding: 12px;
        border: none;
        background: transparent;
        cursor: pointer;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        color: #666;
      }

      .tab-button.active {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      .form-container {
        position: relative;
      }

      .form-section {
        display: none;
        animation: fadeIn 0.5s ease-in-out;
      }

      .form-section.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
        font-size: 14px;
      }

      .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: #fff;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-group input::placeholder {
        color: #aaa;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 20px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .divider {
        text-align: center;
        margin: 25px 0;
        position: relative;
        color: #666;
        font-size: 14px;
      }

      .divider::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: #e1e5e9;
        z-index: 1;
      }

      .divider span {
        background: rgba(255, 255, 255, 0.95);
        padding: 0 15px;
        position: relative;
        z-index: 2;
      }

      .google-btn {
        width: 100%;
        padding: 14px;
        border: 2px solid #e1e5e9;
        background: white;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 16px;
        font-weight: 500;
        color: #333;
        transition: all 0.3s ease;
        margin-bottom: 20px;
      }

      .google-btn:hover {
        border-color: #667eea;
        background: #f8f9ff;
        transform: translateY(-1px);
      }

      .google-icon {
        width: 20px;
        height: 20px;
        background: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%234285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="%2334A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="%23FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="%23EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>')
          no-repeat center;
        background-size: contain;
      }

      .forgot-password {
        text-align: center;
        margin-top: 15px;
      }

      .forgot-password a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }

      .forgot-password a:hover {
        text-decoration: underline;
      }

      .error-message {
        background: #fee;
        color: #c33;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .success-message {
        background: #efe;
        color: #3c3;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      @media (max-width: 480px) {
        .auth-container {
          padding: 30px 20px;
          margin: 10px;
        }

        .logo h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="logo">
        <h1>Dairy Management</h1>
        <p>Professional dairy business solution</p>
      </div>

      <div class="form-tabs">
        <button class="tab-button active" onclick="switchTab('login')">
          Login
        </button>
        <button class="tab-button" onclick="switchTab('signup')">
          Sign Up
        </button>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <div class="form-container">
        <!-- Login Form -->
        <div id="login-section" class="form-section active">
          <form id="login-form">
            <div class="form-group">
              <label for="login-email">Email Address</label>
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
          </form>

          <div class="divider">
            <span>or</span>
          </div>

          <button class="google-btn" onclick="signInWithGoogle()">
            <div class="google-icon"></div>
            Continue with Google
          </button>

          <div class="forgot-password">
            <a href="#" onclick="showForgotPassword()">Forgot your password?</a>
          </div>
        </div>

        <!-- Signup Form -->
        <div id="signup-section" class="form-section">
          <form id="signup-form">
            <div class="form-group">
              <label for="signup-name">Full Name</label>
              <input
                type="text"
                id="signup-name"
                name="name"
                placeholder="Enter your full name"
                required
              />
            </div>
            <div class="form-group">
              <label for="signup-email">Email Address</label>
              <input
                type="email"
                id="signup-email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="form-group">
              <label for="signup-password">Password</label>
              <input
                type="password"
                id="signup-password"
                name="password"
                placeholder="Create a password"
                required
              />
            </div>
            <div class="form-group">
              <label for="signup-confirm-password">Confirm Password</label>
              <input
                type="password"
                id="signup-confirm-password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
              />
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
          </form>

          <div class="divider">
            <span>or</span>
          </div>

          <button class="google-btn" onclick="signUpWithGoogle()">
            <div class="google-icon"></div>
            Sign up with Google
          </button>
        </div>
      </div>
    </div>

    <script>
          // This line is added. It gets the prefix from the Flask backend.
      const API_BASE_PATH = {{ api_prefix | tojson }};
          // Tab switching functionality
          function switchTab(tab) {
            const loginSection = document.getElementById("login-section");
            const signupSection = document.getElementById("signup-section");
            const tabButtons = document.querySelectorAll(".tab-button");

            // Clear any messages
            hideMessages();

            if (tab === "login") {
              loginSection.classList.add("active");
              signupSection.classList.remove("active");
              tabButtons[0].classList.add("active");
              tabButtons[1].classList.remove("active");
            } else {
              signupSection.classList.add("active");
              loginSection.classList.remove("active");
              tabButtons[1].classList.add("active");
              tabButtons[0].classList.remove("active");
            }
          }

          // Message display functions
          function showError(message) {
            const errorDiv = document.getElementById("error-message");
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
            document.getElementById("success-message").style.display = "none";
          }

          function showSuccess(message) {
            const successDiv = document.getElementById("success-message");
            successDiv.textContent = message;
            successDiv.style.display = "block";
            document.getElementById("error-message").style.display = "none";
          }

          function hideMessages() {
            document.getElementById("error-message").style.display = "none";
            document.getElementById("success-message").style.display = "none";
          }

          // Login form submission
          document
            .getElementById("login-form")
            .addEventListener("submit", async function (e) {
              e.preventDefault();

              const email = document.getElementById("login-email").value;
              const password = document.getElementById("login-password").value;

              try {
                // Here you would typically make an API call to your backend
                const response = await fetch("/api/login", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ email, password }),
                });

                if (response.ok) {
                  const data = await response.json();
                  showSuccess("Login successful! Redirecting...");
                  setTimeout(() => {
                    // Redirect to dashboard or main app
                    window.location.href = "/dashboard";
                  }, 1500);
                } else {
                  const error = await response.json();
                  showError(error.message || "Login failed. Please try again.");
                }
              } catch (error) {
                // For demo purposes, show success message
                showSuccess("Login successful! Redirecting to dashboard...");
                setTimeout(() => {
                  // In a real app, you'd redirect to your dashboard
                  console.log("Redirecting to dashboard...");
                }, 1500);
              }
            });

          // Signup form submission
          document
            .getElementById("signup-form")
            .addEventListener("submit", async function (e) {
              e.preventDefault();

              const name = document.getElementById("signup-name").value;
              const email = document.getElementById("signup-email").value;
              const password = document.getElementById("signup-password").value;
              const confirmPassword = document.getElementById(
                "signup-confirm-password"
              ).value;

              if (password !== confirmPassword) {
                showError("Passwords do not match!");
                return;
              }

              if (password.length < 6) {
                showError("Password must be at least 6 characters long!");
                return;
              }

              try {
                // Here you would typically make an API call to your backend
                const response = await fetch("/api/signup", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ name, email, password }),
                });

                if (response.ok) {
                  const data = await response.json();
                  showSuccess("Account created successfully! Please login.");
                  setTimeout(() => {
                    switchTab("login");
                  }, 1500);
                } else {
                  const error = await response.json();
                  showError(error.message || "Signup failed. Please try again.");
                }
              } catch (error) {
                // For demo purposes, show success message
                showSuccess("Account created successfully! You can now login.");
                setTimeout(() => {
                  switchTab("login");
                }, 1500);
              }
            });

          // Google Sign In initialization
          function initializeGoogleSignIn() {
            if (typeof google !== "undefined") {
              google.accounts.id.initialize({
                client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com", // Replace with your actual Google Client ID
                callback: handleGoogleSignIn,
              });
            }
          }

          // Google Sign In callback
          function handleGoogleSignIn(response) {
            console.log("Google Sign In Response:", response);

            // Decode the JWT token to get user info
            const userInfo = parseJwt(response.credential);
            console.log("User Info:", userInfo);

            // Here you would send the token to your backend for verification
            fetch("/api/google-auth", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ token: response.credential }),
            })
              .then((response) => response.json())
              .then((data) => {
                showSuccess("Google sign in successful! Redirecting...");
                setTimeout(() => {
                  window.location.href = "/dashboard";
                }, 1500);
              })
              .catch((error) => {
                // For demo purposes
                showSuccess("Google sign in successful! Redirecting...");
                setTimeout(() => {
                  console.log("Redirecting to dashboard...");
                }, 1500);
              });
          }

          // Utility function to parse JWT token
          function parseJwt(token) {
            try {
              const base64Url = token.split(".")[1];
              const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
              const jsonPayload = decodeURIComponent(
                atob(base64)
                  .split("")
                  .map(function (c) {
                    return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
                  })
                  .join("")
              );
              return JSON.parse(jsonPayload);
            } catch (error) {
              return null;
            }
          }

          // Google Sign In button click handlers
          function signInWithGoogle() {
            if (typeof google !== "undefined") {
              google.accounts.id.prompt();
            } else {
              showError("Google Sign In is not available. Please try again later.");
            }
          }

          function signUpWithGoogle() {
            signInWithGoogle(); // Same process for both sign in and sign up with Google
          }

          // Forgot password functionality
          function showForgotPassword() {
            const email = prompt("Please enter your email address:");
            if (email) {
              // Here you would typically send a password reset request
              showSuccess("Password reset instructions sent to your email!");
            }
          }

          // Initialize Google Sign In when the page loads
          window.addEventListener("load", function () {
            setTimeout(initializeGoogleSignIn, 1000); // Delay to ensure Google library is loaded
          });
    </script>
  </body>
</html>
